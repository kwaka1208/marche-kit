<?xml version="1.0" encoding="UTF-8"?>
<!-- ロゴ未設定・読み込み失敗のときにコアが出す代替画像(正方形)。
     テーマではなくサイト側が用意するファイル。core/js/config.js の
     FALLBACK_IMAGES.shop がこのパスを指している -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="no image">
  <rect width="200" height="200" fill="#eeeeee"/>
  <rect x="8" y="8" width="184" height="184" fill="none" stroke="#cccccc" stroke-width="2"/>
  <text x="100" y="106" font-family="sans-serif" font-size="18" fill="#999999" text-anchor="middle">no image</text>
</svg>
