<?xml version="1.0" encoding="UTF-8"?>
<!-- 商品画像が未設定・読み込み失敗のときにコアが出す代替画像(4:3)。
     テーマではなくサイト側が用意するファイル。core/js/config.js の
     FALLBACK_IMAGES.item がこのパスを指している -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="no image">
  <rect width="400" height="300" fill="#eeeeee"/>
  <rect x="10" y="10" width="380" height="280" fill="none" stroke="#cccccc" stroke-width="2"/>
  <text x="200" y="158" font-family="sans-serif" font-size="24" fill="#999999" text-anchor="middle">no image</text>
</svg>
